name = "location3"
main = "worker/index.ts"
compatibility_date = "2024-06-20"

[build]
command = "node scripts/prepare-data.mjs"
watch_dir = ["web/static", "scripts"]

[observability]
enabled = true
head_sampling_rate = 1.0

[[routes]]
pattern = "l3.063.jp"
custom_domain = true

[assets]
binding = "ASSETS"
directory = ".generated/assets"
